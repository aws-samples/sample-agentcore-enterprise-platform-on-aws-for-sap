    reason: 'Illustrative summary of an S/4HANA OData service, written for this sample (its info.description
      says so), describing how SAP''s gateway behaves: SAP authenticates a technical user with Basic over
      TLS and applies schemes per operation. Nothing in this repo serves a route from it or authenticates
      against it; knowledge.py only uploads it as seed text for the api-docs knowledge base. Editing it
