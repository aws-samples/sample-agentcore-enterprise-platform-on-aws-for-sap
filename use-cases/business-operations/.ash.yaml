  - rule_id: CKV_AWS_116
    path: '*-uc-business-operations-console.template.json'
    reason: 'A Lambda DLQ catches failed asynchronous invokes only. Every function here is invoked synchronously
      (API Gateway, the AgentCore Gateway, AppSync, CloudFormation custom resources, IAM-invoked operator
      verbs), from an SQS event source whose queue has its own redrive DLQ, or by an EventBridge schedule
      or rule, where the next tick repeats the work; the SAP layer''s write alert has a function DLQ and
      an alarm on it. The one async target with a payload, the agent invoker, carries the caller''s token,
      which a DLQ would store: its retries are off and it releases its claim on failure.'
    expiration: '2027-11-01'
