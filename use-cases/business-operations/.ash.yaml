  - rule_id: CKV_OPENAPI_5
    path: use-cases/business-operations/openapi.yaml
    reason: 'One operation declares `security: []` and means it (test_only_the_push_route_opts_out_of_the_authorizer
      pins it). POST /erp-events is called by a SAP SM59 destination that holds no Cognito session; it
      is not unauthenticated: pipeline/erp_events.py checks a shared token with hmac.compare_digest and
      refuses everything while the secret is empty, the method is throttled to 50 RPS, and the body is
      capped at 1 MB. Declaring an authorizer it does not have is the inaccuracy the rule asks for.'
    expiration: '2027-11-01'
  - rule_id: CKV_OPENAPI_21
    path: use-cases/business-operations/openapi.yaml
    reason: 'Every array a client can send is capped: SapEventEnvelope.records (maxItems 100) and the
      create spec''s process_types (50) and attributes (100), each enforced server-side as well, and test_every_request_side_array_in_the_contract_is_capped
      fails if a request-side array without maxItems appears. Checkov reports this rule once per file,
      at the first uncapped array, which is now a response the API produces (GET /cases items, paged by
      next_token with a bounded limit). An unbounded client-posted list is the rule''s threat; a response
      array is not.'
    expiration: '2027-11-01'
