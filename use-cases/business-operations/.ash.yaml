    path: use-cases/business-operations/verify.py
    reason: Operator CLI. The URL is an https:// f-string literal naming this deployment's Cognito domain,
      built from the project/env config and the caller's own STS account id; no untrusted input reaches
      it.
    expiration: '2027-11-01'
