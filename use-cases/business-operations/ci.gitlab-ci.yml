# Business-operations jobs, included from the root .gitlab-ci.yml. Anchors do not
# cross an include, so the shared cache comes in through `extends: .pip-cache`.

# The agent's own tests need the image's dependencies (Strands, AG-UI, the AgentCore
# SDK), which the platform suite does not carry, so they sit beside the agent and run
# here against its pinned requirements.txt.
agent:
  stage: test
  extends: .pip-cache
  before_script:
    - pip install -q -r use-cases/business-operations/agent/requirements.txt pytest
    - unset AWS_REGION AWS_DEFAULT_REGION AWS_PROFILE
  script:
    - python -m pytest -q use-cases/business-operations/agent/tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - use-cases/business-operations/agent/**/*
        - use-cases/business-operations/ci.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"

# The console's typecheck, vitest and production build (its 500 kB chunk budget).
# Changes-scoped, unlike pytest: nothing outside these paths reaches the bundle.
# `npm run build` is `tsc && vite build`, so it is also the typecheck (tsconfig sets
# noEmit), and vite.config.ts fails it when any chunk passes 500 kB.
console:
  stage: test
  image: public.ecr.aws/docker/library/node:22-slim
  cache:
    key: npm-$CI_JOB_NAME
    paths: [.cache/npm]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  script:
    - cd use-cases/business-operations/frontend
    - npm ci --no-audit --no-fund
    - npx vitest --run
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - use-cases/business-operations/frontend/**/*
        - use-cases/business-operations/packages/**/*
        - use-cases/business-operations/ci.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
