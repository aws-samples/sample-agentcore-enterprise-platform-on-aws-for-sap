# ASH (AWS Labs Automated Security Helper). `scripts/check-security.sh` runs it
# over the source and over the templates the production fixtures synthesize, as CI
# does, and either fails on any MEDIUM or worse finding not suppressed here.
#
# The rule for a suppression: classify the finding first and fix the real ones.
# A suppression is scoped to the one file the finding was read in (never a glob
# over a language or a directory), its reason names the control that makes the
# finding safe in that file, and it carries an expiration, which is a re-review
# date. Never blanket-suppress a rule. A template's path is the one exception to an
# exact path: `*-<stack>.template.json` names one stack's template whatever the
# project and environment, because the synth directory is a temporary one. A
# suppressed finding is invisible, so the only way to learn whether an entry still
# catches anything is to remove it and re-run the scan.

global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    # ignore_paths applies where findings are aggregated, not where scanners run,
    # so entries here are for material that is not this repo's source at all.
    - path: ".venv"
      reason: "Local virtualenv: third-party packages, not source"
    - path: "node_modules"
      reason: "Third-party dependencies"
    - path: "cdk.out"
      reason: "Local synth output. Bundled assets are copies of source scanned at its real path, and the templates are scanned by `scripts/check-security.sh templates`, which synthesizes the production fixtures afresh rather than whatever was synthesized here last"
    - path: ".ash"
      reason: "ASH's own output directory"
    - path: ".pytest_cache"
      reason: "Pytest cache, not source"
  suppressions:
    # Every entry below was classified from a full local run (ASH 3.2.2, --mode
    # local). Entries sharing a reason do so through a YAML anchor, but each is
    # still one finding in one file.
    - rule_id: "B108"
      path: "tests/test_usecase_scaffold.py"
      reason: "\"/tmp\" is only the fallback value of HOME in a scrubbed subprocess environment; the test creates no file there."
      expiration: "2027-11-01"
    - rule_id: "B108"
