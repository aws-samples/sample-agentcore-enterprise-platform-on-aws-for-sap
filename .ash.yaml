      path: "migration/adapter/Dockerfile"
      reason: "Template built FROM the customer's own image by the migration buildspec. AgentCore Runtime probes the adapter over its /ping contract, not a Docker HEALTHCHECK, which the runtime does not run."
      expiration: "2027-11-01"
    - rule_id: "CKV_DOCKER_2"
      path: "migration/simulation/existing-ec2-agent/Dockerfile"
      reason: "Simulation fixture standing in for a customer's pre-existing agent image; it is wrapped by migration/adapter, whose /ping contract is what AgentCore probes. Never deployed on its own."
      expiration: "2027-11-01"
