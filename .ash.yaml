    # cfn-nag (first real run, 2026-11-05). Warnings only; cfn-nag reported 0 failures. Each
    # entry is one rule on one stack's template, classified from the production synth.
    # Rules with a checkov twin reuse that twin's reason and expiry. W41 is fixed in code.
    - rule_id: "CFN_NAG_W12"
      path: "*-layer-sap.template.json"
      reason: &cfnstar "cfn-nag W12 flags a statement on Resource \"*\". Every such statement here grants only actions with no resource-level permission or CDK's own provider actions: X-Ray trace writes, the ECR auth token (the pull itself is scoped to the repository), CloudWatch PutMetricData under a cloudwatch:namespace condition, LogRetention's retention calls, BucketDeployment's CloudFront invalidation, and Transaction Search's one-time account setup (X-Ray segment destination and indexing rule, the CloudWatch Logs resource policy, Application Signals discovery). The cdk-nag gate (.cdk-nag.yaml, AwsSolutions-IAM5) pins each policy's exact star_actions, so any new action on * fails CI."
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W12"
      path: "*-observability.template.json"
      reason: *cfnstar
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W12"
      path: "*-runtime-orchestrator.template.json"
      reason: &cfnstarrt "cfn-nag W12 flags a statement on Resource \"*\". In this runtime role that is the AgentCore data-plane statement (InvokeGateway, Memory events, browser sessions) and X-Ray, ECR-token and namespaced PutMetricData. ACCEPTED: the AgentCore actions take ARNs this stack does not know at synth; the Gateway still needs a JWT and Memory is partitioned by actor id. Pinned by cdk-nag star_actions (AwsSolutions-IAM5) with the same expiry, so a new action on * fails CI."
      expiration: "2027-02-01"
    - rule_id: "CFN_NAG_W28"
      path: "*-gateway.template.json"
      reason: &cfnnames "Explicit names are deliberate: roles, ECR repositories, security groups and alarms are named <project>-<environment>-... so operators, verify scripts, IAM and SCP conditions and other stacks can find them. cfn-nag W28 warns that a change requiring replacement then fails to deploy; CloudFormation reports that as a failed update and rolls back. No security property depends on it."
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W28"
      path: "*-layer-sap.template.json"
      reason: *cfnnames
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W28"
      path: "*-networking.template.json"
      reason: *cfnnames
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W28"
      path: "*-observability.template.json"
      reason: *cfnnames
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W28"
      path: "*-runtime-orchestrator.template.json"
      reason: *cfnnames
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W33"
      path: "*-networking.template.json"
      reason: &cfnpublic "The VPC's two public subnets exist for the NAT gateway only. Runtimes and SAP-facing functions are placed in the private subnets or the synth fails (infra_utils/runtime_network.py); nothing in this deployment launches an instance or ENI in a public subnet."
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W35"
      path: "*-security.template.json"
      reason: *tpllogsink
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W40"
      path: "*-networking.template.json"
      reason: &cfnendpointsg "CDK's default security group on an interface VPC endpoint (Amazon Bedrock runtime, ECR api and dkr, Logs, AgentCore Gateway). An endpoint's network interface only answers connections and never initiates one, so its all-protocol egress rule carries no traffic; ingress is TCP 443 from the VPC CIDR only."
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W5"
      path: "*-layer-sap.template.json"
      reason: &cfnsapsg "ACCEPTED: the SAP MCP runtime's group allows TCP egress only to the ports of the configured SAP base URLs (443 plus each system's own port) and has no ingress. SAP hosts are configured by hostname, so no CIDR is known at synth; narrowing the destination to the SAP network's CIDR is the adopter's step."
      expiration: "2027-05-01"
    - rule_id: "CFN_NAG_W5"
      path: "*-networking.template.json"
      reason: &cfnnetsg "Six groups on this template. Five are CDK's default groups on the interface VPC endpoints, whose network interfaces only answer connections, so their open egress carries no traffic (ingress: TCP 443 from the VPC CIDR). ACCEPTED for the sixth, the AgentCore runtime group: TCP 443 egress to any address and no ingress, because runtimes call AWS public endpoints and, through the one NAT gateway, HTTPS APIs with no fixed addresses; DNS or Network Firewall egress filtering is the adopter's control."
      expiration: "2027-05-01"
    - rule_id: "CFN_NAG_W58"
      path: "*-auth.template.json"
      reason: &cfnlogperm "cfn-nag cannot resolve the managed-policy ARN, which CDK builds with Fn::Join on the partition. Every function's role attaches AWSLambdaBasicExecutionRole or AWSLambdaVPCAccessExecutionRole, which grant the CloudWatch Logs writes: all 40 functions in the production synth were checked, and cdk-nag IAM4 pins those two policies."
      expiration: "2027-11-01"
    - rule_id: "CFN_NAG_W58"
