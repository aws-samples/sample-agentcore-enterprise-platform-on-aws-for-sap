# Parity fixture: presets/production.yaml with no use case and the egress filter blocking,
# so check-contract.sh and the platform tests prove the platform alone synthesizes under
# deployment.mode: production. Its placeholders stay unfilled, as in the preset; both
# synthesize with PLATFORM_ALLOW_PLACEHOLDERS=1. Keep the rest in step with the preset.
project: agentcore-production
environment: prod
region: us-east-1
deployment:
  mode: production
  strategy: centralized
  platform_account: '000000000000'
identity:
  idp: entra_id
  mode: brokered
  tenant_id: 00000000-0000-0000-0000-000000000000
  client_id: REPLACE_ME
  client_secret_name: agentcore/idp-client-secret
agents:
  pattern: strands-agent
  model_id: us.anthropic.claude-sonnet-4-6
  allowed_models:
  - us.anthropic.claude-sonnet-4-6
  memory:
    event_expiry_days: 30
gateway:
  web_search: 'off'
  tools:
  - sample-tool
security:
  networking: true
  cloudtrail_alerting: true
  resource_policies: true
  egress_filter: true
  egress_request_action: block
  require_guardrails: true
  cedar:
    enabled: true
    mode: ENFORCE
  traceability: true
  org_id: o-example1234
observability:
  transaction_search: true
  alarms: true
  alarm_email: ops@REPLACE_ME.invalid
  log_retention_days: 90
