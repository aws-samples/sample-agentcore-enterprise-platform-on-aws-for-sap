[pytest]
# scripts/test_*.py are live smoke scripts run by hand against a deployed stack,
# not tests; bare `pytest` collects the platform suite and the fork's own tests,
# each beside what it covers. Each use case's and layer's tests/ is found by pattern,
# so adding or deleting one changes nothing here. A use case's agent/tests that need
# the agent image's dependencies run in that use case's own CI job.
testpaths = tests use-cases/*/tests layers/*/tests sap_kit/tests
